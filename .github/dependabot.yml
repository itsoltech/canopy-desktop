# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Strategy: weekly, grouped, non-major bumps so the review surface stays small.
# Majors are excluded from the groups and arrive as individual PRs.
# Review gate is intentionally kept: a maintainer still applies
# `claude:review:approved` before auto-merge (see .github/workflows/auto-merge.yml).
version: 2
updates:
  # ---- Root: Electron + Svelte 5 desktop app ----
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ---- Mobile: Expo + React Native app ----
  - package-ecosystem: npm
    directory: '/mobile'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Expo SDK pins react-native / react / expo-* to exact versions. They must be
    # upgraded together via `expo install` / an SDK bump, never piecemeal by
    # Dependabot — a stray react-native minor breaks the Metro/native build
    # (this is exactly what slipped into the grouped PR #263).
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ---- GitHub Actions workflows ----
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
