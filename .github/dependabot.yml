# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Strategy: weekly, grouped, non-major bumps so the review surface stays small.
# Majors are excluded from every group and arrive as individual PRs.
# Updates target `next` (the integration branch) explicitly.
# Review gate is intentionally kept: a maintainer still applies
# `claude:review:approved` before auto-merge (see .github/workflows/auto-merge.yml).
version: 2
updates:
  # ---- Root: Electron + Svelte 5 desktop app ----
  - package-ecosystem: npm
    directory: '/'
    target-branch: 'next'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Native modules are rebuilt against Electron's ABI by `install-app-deps`
      # (postinstall). better-sqlite3 must support the Electron ABI it is rebuilt
      # against — a version mismatch broke the build in #273. Keep Electron and the
      # native modules in ONE PR (majors included, unlike every other group) so they
      # are reviewed and rebuilt together, never a stray Electron major landing alone.
      # Listed first so these three are pulled out of the catch-all `npm` group below.
      electron-native:
        patterns:
          - 'electron'
          - 'better-sqlite3'
          - 'node-pty'
        update-types:
          - major
          - minor
          - patch
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ---- Mobile: Expo + React Native app ----
  - package-ecosystem: npm
    directory: '/mobile'
    target-branch: 'next'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Expo SDK pins the React Native / React / Expo packages to exact versions.
    # They must be upgraded together via `expo install` / an SDK bump, never
    # piecemeal by Dependabot — a stray react-native minor breaks the Metro/native
    # build (this is exactly what slipped into the grouped PR #263). The scoped
    # @expo/* and @react-native/* globs cover packages like @expo/ui that the
    # unscoped expo-* / react-native-* patterns miss.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ---- GitHub Actions workflows ----
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: 'next'
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
