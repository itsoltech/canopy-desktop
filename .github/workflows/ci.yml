name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, next, rust-rewrite]
  pull_request:
    branches: [main, next, rust-rewrite]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install buf 1.57.2
        run: |
          curl --fail --location --silent --show-error https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64 --output "$RUNNER_TEMP/buf"
          echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  $RUNNER_TEMP/buf" | sha256sum --check
          chmod +x "$RUNNER_TEMP/buf"
      - name: Lint typed API contract
        run: '"$RUNNER_TEMP/buf" lint'
  check:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        run: brew install protobuf
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --lib
      - name: Build local release bundle
        run: ./scripts/build-macos.sh release
