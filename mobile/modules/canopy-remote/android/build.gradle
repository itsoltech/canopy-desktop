plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'tech.itsol.canopy.remote'
version = '1.0.0'
android {
  namespace 'tech.itsol.canopy.remote'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  implementation 'io.grpc:grpc-okhttp:1.71.0'
  implementation 'io.grpc:grpc-stub:1.71.0'
  implementation 'com.hierynomus:sshj:0.39.0'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
  implementation 'org.bouncycastle:bcutil-jdk18on:1.80'
}
