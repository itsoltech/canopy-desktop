  }
  rpc Restart(RestartRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.restart" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc Steer(SteerRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.steer" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
