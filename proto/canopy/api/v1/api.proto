  rpc RespondDecision(RespondDecisionRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.respond" risk: RISK_DELIVERY scopes: SCOPE_APPROVE};
  }
  rpc SetAgentOption(SetAgentOptionRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.set_option" risk: RISK_CONFIGURATION scopes: SCOPE_CHAT};
  }
  rpc SetThreadAgent(SetThreadAgentRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.set_agent" risk: RISK_CONFIGURATION scopes: SCOPE_CHAT};
  }
  rpc SetGoal(SetGoalRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.set_goal" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc PauseGoal(PauseGoalRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.pause_goal" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc ResumeGoal(ResumeGoalRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.resume_goal" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc ClearGoal(ClearGoalRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.clear_goal" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc StopBackground(StopBackgroundRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.stop_background" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc EditMessage(EditMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.edit" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc RunShell(RunShellRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.shell" risk: RISK_DELIVERY scopes: SCOPE_CHAT scopes: SCOPE_TERMINAL};
  }
  rpc StopShell(StopShellRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.stop_shell" risk: RISK_DELIVERY scopes: SCOPE_CHAT scopes: SCOPE_TERMINAL};
  }
  rpc ForkThread(ForkThreadRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.fork" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc SendMessage(SendMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.send" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc EditQueueMessage(EditQueueMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.queue.edit" risk: RISK_METADATA scopes: SCOPE_CHAT};
  }
  rpc MoveQueueMessage(MoveQueueMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.queue.move" risk: RISK_METADATA scopes: SCOPE_CHAT};
  }
  rpc RemoveQueueMessage(RemoveQueueMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.queue.remove" risk: RISK_METADATA scopes: SCOPE_CHAT};
  }
  rpc PauseQueue(PauseQueueRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.queue.pause" risk: RISK_METADATA scopes: SCOPE_CHAT};
  }
  rpc ResolveUnknownQueueMessage(ResolveUnknownQueueMessageRequest) returns (CommandReceipt) {
    option (command) = {name: "chat.queue.resolve_unknown" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (HostSettings);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.preferences" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc SaveAgentDefinition(SaveAgentDefinitionRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.agent.save" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc RemoveAgentDefinition(RemoveAgentDefinitionRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.agent.remove" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc SaveProfile(SaveProfileRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.profile.save" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc RemoveProfile(RemoveProfileRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.profile.remove" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc SaveIntegration(SaveIntegrationRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.integration.save" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
  rpc RemoveIntegration(RemoveIntegrationRequest) returns (CommandReceipt) {
    option (command) = {name: "settings.integration.remove" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
}

message Empty {}
message GetSettingsRequest { EnvironmentRef environment = 1; }
message SecretUpdate { oneof action { Empty unchanged = 1; bytes set = 2; Empty remove = 3; } }
message EnvironmentField { string name = 1; bool configured = 2; }
message EnvironmentUpdate { string name = 1; SecretUpdate value = 2; }
message AgentDefinition { string id = 1; string name = 2; BackendKind backend_kind = 3; string command = 4; repeated string arguments = 5; repeated EnvironmentField environment = 6; optional bool enabled = 7; optional string default_profile_id = 8; }
message StringValues { repeated string values = 1; }
message Profile {
  string id = 1; string agent_id = 2; string name = 3; repeated EnvironmentField environment = 4; bool credential_configured = 5;
  optional string model = 6; StringValues arguments = 7; ProfileAgentSettings settings = 8;
}
// Only presence and nonsecret options are returned. Omitted writes preserve state.
message ProfileAgentSettings {
  optional string permission_mode = 1; optional string effort_level = 2;
  optional string base_url = 3; optional string provider = 4;
  optional string approval_mode = 5; optional string sandbox = 6;
  optional bool full_auto = 7; optional bool bypass_approvals = 8;
  optional string config_profile = 9;
  bool system_prompt_configured = 10; bool settings_override_configured = 11;
}
message ProfileSettingsUpdate { ProfileAgentSettings options = 1; SecretUpdate append_system_prompt = 2; SecretUpdate settings_json = 3; }
message Integration {
  string id = 1; string kind = 2; string name = 3; string endpoint = 4; bool credential_configured = 5;
  optional string owner = 6; optional string email = 7; optional string cloud_id = 8;
}
message HostSettings { EnvironmentRef environment = 1; uint64 revision = 2; repeated AgentDefinition agents = 3; repeated Profile profiles = 4; repeated Integration integrations = 5; Preferences preferences = 6; }
message SaveAgentDefinitionRequest { CommandMeta command = 1; EnvironmentRef environment = 2; AgentDefinition agent = 3; repeated EnvironmentUpdate variables = 4; }
message RemoveAgentDefinitionRequest { CommandMeta command = 1; EnvironmentRef environment = 2; string agent_id = 3; }
message SaveProfileRequest { CommandMeta command = 1; EnvironmentRef environment = 2; Profile profile = 3; repeated EnvironmentUpdate variables = 4; SecretUpdate credential = 5; ProfileSettingsUpdate settings = 6; }
message RemoveProfileRequest { CommandMeta command = 1; EnvironmentRef environment = 2; string profile_id = 3; }
message SaveIntegrationRequest { CommandMeta command = 1; EnvironmentRef environment = 2; Integration integration = 3; SecretUpdate credential = 4; }
message RemoveIntegrationRequest { CommandMeta command = 1; EnvironmentRef environment = 2; string integration_id = 3; }

// Bootstrap proof and local approval precede any authenticated command principal.
service HostService {
  rpc GetInfo(GetInfoRequest) returns (HostInfo);
  rpc WatchHost(WatchHostRequest) returns (stream HostStatus);
  rpc ListDevices(ListDevicesRequest) returns (Devices);
  rpc ReadDiagnostics(ReadDiagnosticsRequest) returns (DiagnosticsSnapshot);
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
  // Maintenance of the caller's inbox does not create an inbox command.
  rpc ResolveCommand(ResolveCommandRequest) returns (ResolveCommandResponse);
  rpc CloseCommandEpoch(CloseCommandEpochRequest) returns (CommandEpoch);
  rpc RevokeDevice(RevokeDeviceRequest) returns (CommandReceipt) {
    option (command) = {name: "host.revoke" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
}
message GetInfoRequest { EnvironmentRef environment = 1; }
message WatchHostRequest { EnvironmentRef environment = 1; }
message ReadDiagnosticsRequest { EnvironmentRef environment = 1; }
message Limits {
  uint64 control_bytes = 1; uint64 chunk_bytes = 2; uint64 client_queue_bytes = 3;
  uint64 history_page_bytes = 4; uint32 history_page_items = 5; uint32 chat_processes = 6;
}
message HostInfo {
  EnvironmentRef environment = 1; string application_version = 2; uint32 protocol_version = 3;
  repeated Capability capabilities = 4; uint64 command_epoch = 5; Limits limits = 6;
}
enum HostReadiness {
  HOST_READINESS_UNSPECIFIED = 0; HOST_READINESS_STARTING = 1; HOST_READINESS_READY = 2;
  HOST_READINESS_DRAINING = 3; HOST_READINESS_STORAGE_FAULT = 4;
}
message HostStatus { EnvironmentRef environment = 1; HostReadiness readiness = 2; string reason = 3; Cursor cursor = 4; }
message ListDevicesRequest { EnvironmentRef environment = 1; optional string page_token = 2; bool include_revoked = 3; }
message Devices { EnvironmentRef environment = 1; repeated Device devices = 2; optional string next_page_token = 3; }
message CommandResource {
  oneof target { ThreadTarget thread = 1; ProjectRef project = 2; EnvironmentRef environment = 3; }
}
message GetCommandRequest {
  EnvironmentRef environment = 1; string command_id = 2; uint64 command_epoch = 3;
  // Omission supports ID lookup only when the authorized result is unambiguous.
  CommandResource resource = 4;
}
message ResolveCommandRequest {
  EnvironmentRef environment = 1; string command_id = 2; uint64 command_epoch = 3;
  CommandResource resource = 4;
}
enum CommandLookupState {
  COMMAND_LOOKUP_STATE_UNSPECIFIED = 0; COMMAND_LOOKUP_STATE_FOUND = 1;
  COMMAND_LOOKUP_STATE_NOT_FOUND = 2; COMMAND_LOOKUP_STATE_RETIRED = 3;
}
message GetCommandResponse { CommandLookupState state = 1; CommandReceipt receipt = 2; }
message ResolveCommandResponse { CommandReceipt receipt = 1; }
message CloseCommandEpochRequest { EnvironmentRef environment = 1; uint64 expected_epoch = 2; }
message CommandEpoch { EnvironmentRef environment = 1; uint64 epoch = 2; }
message RevokeDeviceRequest { CommandMeta command = 1; EnvironmentRef environment = 2; string device_id = 3; }
message StageSummary { string stage = 1; uint64 count = 2; uint64 total_us = 3; uint64 max_us = 4; uint64 p95_upper_us = 5; }
message TimingRecord {
  uint64 sequence = 1; string host_id = 2; string resource_id = 3; string command_id = 4;
  uint64 generation = 5; string stage = 6; uint64 duration_us = 7; string state = 8;
  string error_code = 9; string device_id = 10; uint64 command_epoch = 11;
}
message DiagnosticsSnapshot {
  uint32 schema_version = 1; string process_instance_id = 2; repeated StageSummary summaries = 3;
  repeated TimingRecord records = 4; uint64 dropped_records = 5; uint64 rejected_keys = 6;
}

service PeerService {
  rpc GetPeerRequest(GetPeerRequestRequest) returns (PeerCertificateRequest);
  rpc ConnectPeer(ConnectPeerRequest) returns (CommandReceipt) {
    option (command) = {name: "peer.connect" risk: RISK_CONFIGURATION scopes: SCOPE_ADMIN};
  }
}
message GetPeerRequestRequest { EnvironmentRef environment = 1; }
message PeerCertificateRequest { EnvironmentRef environment = 1; bytes certificate_signing_request = 2; }
message PeerHost {
  EnvironmentRef environment = 1; string name = 2; string server_name = 3; bytes certificate = 4;
  bytes certificate_sha256 = 5; repeated string addresses = 6; uint32 port = 7; bool return_tunnel = 8;
}
message ConnectPeerRequest {
  CommandMeta command = 1; EnvironmentRef environment = 2; PeerHost peer = 3;
  bytes certificate = 4; repeated bytes certificate_chain = 5;
}

service EnrollmentService {
  rpc RequestPairing(RequestPairingRequest) returns (PairingStatus);
  rpc GetPairingStatus(GetPairingStatusRequest) returns (PairingStatus);
}
message PairingInvite {
  uint32 protocol_version = 1; string host_id = 2; string server_name = 3;
  string address = 4; uint32 port = 5; bytes host_certificate = 6;
  bytes certificate_sha256 = 7; bytes one_time_token = 8; uint64 expires_unix = 9;
}
message RequestPairingRequest { bytes one_time_token = 1; bytes certificate_signing_request = 2; string device_name = 3; EnvironmentRef environment = 4; }
message GetPairingStatusRequest { string request_id = 1; bytes proof = 2; EnvironmentRef environment = 3; }
enum PairingState { PAIRING_STATE_UNSPECIFIED = 0; PAIRING_STATE_PENDING = 1; PAIRING_STATE_APPROVED = 2; PAIRING_STATE_DENIED = 3; PAIRING_STATE_EXPIRED = 4; }
message Device { string device_id = 1; string name = 2; repeated Scope scopes = 3; repeated string roots = 4; bool revoked = 5; }
message PairingStatus {
  string request_id = 1; PairingState state = 2; optional bytes certificate = 3;
  repeated bytes certificate_chain = 4; optional Device device = 5;
}

service ArtifactsService {
  rpc GetUpload(GetUploadRequest) returns (UploadStatus);
