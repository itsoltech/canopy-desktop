  rpc PutChunk(PutChunkRequest) returns (UploadStatus);
  rpc Download(DownloadRequest) returns (stream ArtifactChunk);
  rpc BeginImageUpload(BeginImageUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.image.begin" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc FinishImageUpload(FinishImageUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.image.finish" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc CancelImageUpload(CancelImageUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.image.cancel" risk: RISK_DELIVERY scopes: SCOPE_CHAT};
  }
  rpc BeginFileUpload(BeginFileUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.file.begin" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc FinishFileUpload(FinishFileUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.file.finish" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc CancelFileUpload(CancelFileUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.file.cancel" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc BeginTaskUpload(BeginTaskUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.task.begin" risk: RISK_DELIVERY scopes: SCOPE_TASKS};
  }
  rpc FinishTaskUpload(FinishTaskUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.task.finish" risk: RISK_DELIVERY scopes: SCOPE_TASKS};
  }
  rpc CancelTaskUpload(CancelTaskUploadRequest) returns (CommandReceipt) {
    option (command) = {name: "artifacts.task.cancel" risk: RISK_DELIVERY scopes: SCOPE_TASKS};
  }
}

service TerminalService {
  rpc ReadHistory(TerminalServiceReadHistoryRequest) returns (stream TerminalHistoryEvent);
  rpc TerminalSession(stream TerminalSessionRequest) returns (stream TerminalServerEvent);
  rpc OpenTerminal(OpenTerminalRequest) returns (CommandReceipt) {
    option (command) = {name: "terminal.open" risk: RISK_DELIVERY scopes: SCOPE_TERMINAL};
  }
  rpc AcquireInput(AcquireInputRequest) returns (CommandReceipt) {
    option (command) = {name: "terminal.acquire" risk: RISK_DELIVERY scopes: SCOPE_TERMINAL};
