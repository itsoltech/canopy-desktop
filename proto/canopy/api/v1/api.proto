enum TerminalInputMode {
  TERMINAL_INPUT_MODE_UNSPECIFIED = 0; TERMINAL_INPUT_MODE_APPLICATION_CURSOR = 1; TERMINAL_INPUT_MODE_APPLICATION_KEYPAD = 2;
  TERMINAL_INPUT_MODE_BRACKETED_PASTE = 4; TERMINAL_INPUT_MODE_ALTERNATE_SCREEN = 8; TERMINAL_INPUT_MODE_CURSOR_VISIBLE = 16;
  TERMINAL_INPUT_MODE_NEW_LINE_MODE = 32; TERMINAL_INPUT_MODE_FOCUS_REPORTING = 64; TERMINAL_INPUT_MODE_MOUSE_CLICK = 128; TERMINAL_INPUT_MODE_MOUSE_DRAG = 256;
  TERMINAL_INPUT_MODE_MOUSE_MOTION = 512; TERMINAL_INPUT_MODE_SGR_MOUSE = 1024; TERMINAL_INPUT_MODE_UTF8_MOUSE = 2048; TERMINAL_INPUT_MODE_ALTERNATE_SCROLL = 4096;
}
enum TerminalCellFlag {
  TERMINAL_CELL_FLAG_UNSPECIFIED = 0; TERMINAL_CELL_FLAG_CELL_BOLD = 1; TERMINAL_CELL_FLAG_CELL_ITALIC = 2; TERMINAL_CELL_FLAG_CELL_UNDERLINE = 4;
  TERMINAL_CELL_FLAG_CELL_INVERSE = 8; TERMINAL_CELL_FLAG_CELL_DIM = 16; TERMINAL_CELL_FLAG_CELL_STRIKEOUT = 32; TERMINAL_CELL_FLAG_CELL_WIDE = 64;
  TERMINAL_CELL_FLAG_CELL_WIDE_SPACER = 128; TERMINAL_CELL_FLAG_CELL_LEADING_WIDE_SPACER = 256; TERMINAL_CELL_FLAG_CELL_HIDDEN = 512;
  TERMINAL_CELL_FLAG_CELL_WRAPLINE = 1024; TERMINAL_CELL_FLAG_CELL_DOUBLE_UNDERLINE = 2048; TERMINAL_CELL_FLAG_CELL_UNDERCURL = 4096;
  TERMINAL_CELL_FLAG_CELL_DOTTED_UNDERLINE = 8192; TERMINAL_CELL_FLAG_CELL_DASHED_UNDERLINE = 16384;
}
