message TerminalServiceReadHistoryRequest { TerminalRef terminal = 1; string run_id = 2; uint32 offset_from_bottom = 3; uint32 rows = 4; optional string page_token = 5; }
message TerminalHistoryStart { Cursor boundary = 1; uint32 offset_from_bottom = 2; uint32 retained_rows = 3; bool lost_scrollback = 4; optional string previous_page_token = 5; }
message TerminalHistoryEvent { TerminalRef terminal = 1; string run_id = 2; oneof part { TerminalHistoryStart start = 3; TerminalFrame frame = 4; Cursor end = 5; TerminalFrameFragment frame_fragment = 6; } }

message UploadContent { uint64 size = 1; bytes sha256 = 2; string media_type = 3; }
message BeginImageUploadRequest { CommandMeta command = 1; ThreadTarget target = 2; UploadContent content = 3; }
message UploadOrigin { string command_id = 1; uint64 command_epoch = 2; }
message FinishImageUploadRequest { CommandMeta command = 1; ThreadTarget target = 2; string upload_id = 3; UploadOrigin origin = 4; }
message CancelImageUploadRequest { CommandMeta command = 1; ThreadTarget target = 2; string upload_id = 3; UploadOrigin origin = 4; }
message BeginFileUploadRequest { CommandMeta command = 1; FileRef file = 2; UploadContent content = 3; }
message FinishFileUploadRequest { CommandMeta command = 1; FileRef file = 2; string upload_id = 3; UploadOrigin origin = 4; }
message CancelFileUploadRequest { CommandMeta command = 1; FileRef file = 2; string upload_id = 3; UploadOrigin origin = 4; }
// Provider project identity is separate from the host resource granting access.
message TaskProject { oneof resource { ProjectRef project = 1; EnvironmentRef environment = 2; } string integration_id = 3; string project_key = 4; }
message TaskRef { TaskProject project = 1; string task_id = 2; }
message BeginTaskUploadRequest { CommandMeta command = 1; TaskRef task = 2; UploadContent content = 3; }
message FinishTaskUploadRequest { CommandMeta command = 1; TaskRef task = 2; string upload_id = 3; UploadOrigin origin = 4; }
message CancelTaskUploadRequest { CommandMeta command = 1; TaskRef task = 2; string upload_id = 3; UploadOrigin origin = 4; }
message ArtifactResult { string upload_id = 1; ArtifactRef artifact = 2; }
message ByteRange { uint64 offset = 1; uint64 length = 2; }
message UploadStatus { EnvironmentRef environment = 1; string upload_id = 2; repeated ByteRange received = 3; ArtifactRef artifact = 4; }
message GetUploadRequest { EnvironmentRef environment = 1; string upload_id = 2; }
message PutChunkRequest { EnvironmentRef environment = 1; string upload_id = 2; uint64 offset = 3; bytes data = 4; }
message DownloadRequest { ArtifactRef artifact = 1; uint64 offset = 2; }

// Integration keys identify the provider project; the resource identifies its
// host authority. They are never interpreted as filesystem paths.
service TasksService {
  rpc ListIntegrations(ListIntegrationsRequest) returns (TaskIntegrations);
  rpc ListProjects(ListProjectsRequest) returns (TaskChoicePage);
  rpc QueryTasks(QueryTasksRequest) returns (TaskPage);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc GetSchema(GetSchemaRequest) returns (TaskSchema);
  rpc ReadOptions(ReadOptionsRequest) returns (TaskChoicePage);
  rpc ReadComments(ReadCommentsRequest) returns (TaskCommentPage);
  rpc ReadAttachment(ReadAttachmentRequest) returns (stream ArtifactChunk);
  rpc ApplyMutation(ApplyMutationRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.mutate" risk: RISK_DELIVERY scopes: SCOPE_TASKS };
  }
  rpc UpdateTask(UpdateTaskRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.update" risk: RISK_DELIVERY scopes: SCOPE_TASKS };
  }
  rpc SaveFilter(SaveFilterRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.save_filter" risk: RISK_CONFIGURATION scopes: SCOPE_TASKS };
  }
  rpc RemoveFilter(RemoveFilterRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.remove_filter" risk: RISK_CONFIGURATION scopes: SCOPE_TASKS };
  }
  rpc TaskToWorktree(TaskToWorktreeRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.worktree" risk: RISK_DELIVERY scopes: SCOPE_TASKS scopes: SCOPE_FILES_GIT };
  }
  rpc ConfigureTaskProject(ConfigureTaskProjectRequest) returns (CommandReceipt) {
    option (command) = { name: "tasks.configure" risk: RISK_CONFIGURATION scopes: SCOPE_TASKS };
  }
}
message TaskProjectKey { string provider = 1; string key = 2; optional string endpoint = 3; }
message TaskFilterSelection { TaskProjectKey project = 1; string filter_id = 2; }
message TaskRepositoryOverride { TaskProjectKey project = 1; }
message TaskLinkedTask { TaskProjectKey project = 1; string task_id = 2; string title = 3; }
message TaskLinks { repeated TaskLinkedTask tasks = 1; }
message ConfigureTaskProjectRequest {
  CommandMeta command = 1;
  oneof resource { ProjectRef project = 2; EnvironmentRef environment = 3; }
  oneof change { TaskFilterSelection filter = 4; TaskRepositoryOverride repository = 5; TaskLinks links = 6; }
}
message ListIntegrationsRequest { oneof resource { ProjectRef project = 1; EnvironmentRef environment = 2; } }
message ListProjectsRequest { TaskProject project = 1; optional string page_token = 2; }
message QueryTasksRequest { TaskProject project = 1; string query = 2; optional string page_token = 3; optional string filter_id = 4; optional string filter_expression = 5; string state = 6; }
message GetTaskRequest { TaskRef task = 1; }
message Task { TaskRef task = 1; string title = 2; string description = 3; string state = 4; string url = 5; repeated ArtifactRef attachments = 6; repeated string labels = 7; repeated string assignees = 8; optional TaskChoice milestone = 9; repeated TaskStatusField statuses = 10; repeated TaskField fields = 11; repeated TaskAttachment task_attachments = 12; repeated Capability capabilities = 13; repeated TaskLink links = 14; }
message TaskLink { string id = 1; string kind = 2; string other_task = 3; string label = 4; bool outward = 5; }
message TaskPage { repeated Task tasks = 1; optional string next_page_token = 2; optional uint64 total_count = 3; repeated TaskFilter filters = 4; }
message UpdateTaskRequest { CommandMeta command = 1; TaskRef task = 2; optional string title = 3; optional string description = 4; TaskStatusChoice status = 5; optional StringValues labels = 6; optional StringValues assignees = 7; optional TaskOptionalChoice milestone = 8; }
message TaskToWorktreeRequest { CommandMeta command = 1; TaskRef task = 2; string branch = 3; }
message TaskChoice { string id = 1; string label = 2; optional string description = 3; google.protobuf.Value value = 4; }
message TaskChoicePage { repeated TaskChoice choices = 1; optional string next_page_token = 2; }
message TaskOptionalChoice { optional string id = 1; }
message TaskIntegration { string id = 1; string name = 2; string provider = 3; bool configured = 4; }
message TaskIntegrations { repeated TaskIntegration integrations = 1; }
message ReadOptionsRequest { TaskProject project = 1; string kind = 2; optional string page_token = 3; optional string board_id = 4; }
message TaskFilter { string id = 1; string name = 2; string expression = 3; string provider = 4; bool builtin = 5; }
message SaveFilterRequest { CommandMeta command = 1; EnvironmentRef environment = 2; TaskFilter filter = 3; }
message RemoveFilterRequest { CommandMeta command = 1; EnvironmentRef environment = 2; string filter_id = 3; }
enum TaskSchemaPurpose { TASK_SCHEMA_PURPOSE_UNSPECIFIED = 0; TASK_SCHEMA_PURPOSE_TASK_CREATE = 1; TASK_SCHEMA_PURPOSE_TASK_EDIT = 2; TASK_SCHEMA_PURPOSE_TASK_TRANSITIONS = 3; TASK_SCHEMA_PURPOSE_TASK_TYPES = 4; TASK_SCHEMA_PURPOSE_TASK_LINK_TYPES = 5; TASK_SCHEMA_PURPOSE_TASK_BOARDS = 6; TASK_SCHEMA_PURPOSE_TASK_SPRINTS = 7; TASK_SCHEMA_PURPOSE_TASK_HISTORY = 8; }
message GetSchemaRequest { TaskProject project = 1; optional TaskRef task = 2; TaskSchemaPurpose purpose = 3; optional string issue_type_id = 4; optional string board_id = 5; optional string page_token = 6; }
message TaskField { string id = 1; string name = 2; string kind = 3; bool required = 4; bool read_only = 5; bool multiple = 6; repeated TaskChoice choices = 7; google.protobuf.Value current_value = 8; google.protobuf.Value default_value = 9; google.protobuf.Struct provider_schema = 10; optional string read_only_reason = 11; }
message TaskTransition { string id = 1; string name = 2; string destination = 3; repeated TaskField required_fields = 4; }
message TaskStatusField { string id = 1; string name = 2; string label = 3; optional string selected_id = 4; repeated TaskChoice choices = 5; optional string read_only_reason = 6; optional string hint = 7; bool requires_form = 8; }
message TaskSchema { repeated TaskField fields = 1; repeated TaskTransition transitions = 2; repeated TaskChoice choices = 3; repeated string activity = 4; optional string next_page_token = 5; }
message TaskStatusChoice { string field_id = 1; string choice_id = 2; google.protobuf.Struct form_fields = 3; optional string comment = 4; }
message TaskComment { string id = 1; string author = 2; string created_at = 3; string body = 4; string url = 5; bool can_edit = 6; bool can_delete = 7; google.protobuf.Value rich_body = 8; }
message ReadCommentsRequest { TaskRef task = 1; optional string page_token = 2; }
message TaskCommentPage { repeated TaskComment comments = 1; optional string next_page_token = 2; uint64 total_count = 3; }
message TaskAttachment { string id = 1; string name = 2; string media_type = 3; uint64 size = 4; bool can_delete = 5; }
message ReadAttachmentRequest { TaskRef task = 1; string attachment_id = 2; }
message TaskIssueDraft { string title = 1; string description = 2; repeated string labels = 3; repeated string assignees = 4; optional string milestone_id = 5; google.protobuf.Struct fields = 6; }
message TaskCommentWrite { optional string comment_id = 1; string body = 2; google.protobuf.Value rich_body = 3; bool delete = 4; }
message TaskFieldWrite { string field_id = 1; google.protobuf.Value value = 2; }
message TaskTagWrite { string id = 1; bool add = 2; }
message TaskAssigneeWrite { string id = 1; bool add = 2; }
message TaskAttachmentWrite { oneof action { ArtifactRef attach = 1; string delete_id = 2; } string name = 3; }
message TaskLinkWrite { string kind = 1; string other_task = 2; bool outward = 3; optional string delete_link_id = 4; }
message TaskWorklogWrite { uint64 seconds = 1; string started = 2; string comment = 3; }
message TaskDelete { string confirmation = 1; bool subtasks = 2; }
message ApplyMutationRequest {
  CommandMeta command = 1; TaskProject project = 2; optional string task_id = 3;
  oneof action { TaskIssueDraft create = 4; TaskFieldWrite field = 5; google.protobuf.Struct fields = 6;
    TaskStatusChoice status = 7; TaskCommentWrite comment = 8; TaskTagWrite tag = 9;
    TaskAssigneeWrite assignee = 10; TaskOptionalChoice milestone = 11; TaskAttachmentWrite attachment = 12;
    TaskLinkWrite link = 13; TaskWorklogWrite worklog = 14; bool watching = 15; bool voted = 16;
    TaskDelete delete = 17; TaskOptionalChoice sprint = 18; }
}
message TaskResult { optional string task_id = 1; optional string url = 2; optional string comment_id = 3; optional string attachment_id = 4; optional string notice = 5; optional string worktree_catalog_id = 6; optional string deleted_task_id = 7; optional string deleted_comment_id = 8; }
