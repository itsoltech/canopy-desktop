  rpc ReleaseInput(ReleaseInputRequest) returns (CommandReceipt) {
    option (command) = {name: "terminal.release" risk: RISK_DELIVERY scopes: SCOPE_TERMINAL};
  }
  rpc StopTerminal(StopTerminalRequest) returns (CommandReceipt) {
    option (command) = {name: "terminal.stop" risk: RISK_DELIVERY scopes: SCOPE_TERMINAL};
  }
  rpc RestartTerminal(RestartTerminalRequest) returns (CommandReceipt) {
    option (command) = {name: "terminal.restart" risk: RISK_DELIVERY scopes: SCOPE_TERMINAL};
  }
}

service FilesService {
  rpc ListDirectory(ListDirectoryRequest) returns (DirectoryEntries);
  rpc SearchFiles(SearchFilesRequest) returns (DirectoryEntries);
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  rpc SaveFile(SaveFileRequest) returns (CommandReceipt) {
    option (command) = {name: "files.save" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc CreateFile(CreateFileRequest) returns (CommandReceipt) {
    option (command) = {name: "files.create" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc SetDirtyPresence(SetDirtyPresenceRequest) returns (CommandReceipt) {
    option (command) = {name: "files.presence" risk: RISK_METADATA scopes: SCOPE_FILES_GIT};
  }
