service GitService {
  rpc Preflight(PreflightRequest) returns (GitPlan);
  rpc GetStatus(GetStatusRequest) returns (GitStatus);
  rpc ReadDiff(ReadDiffRequest) returns (stream DiffChunk);
  rpc ReadHistory(ReadHistoryRequest) returns (GitHistory);
  rpc ListRefs(ListRefsRequest) returns (GitRefs);
  rpc Stage(StageRequest) returns (CommandReceipt) {
    option (command) = {name: "git.stage" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc Unstage(UnstageRequest) returns (CommandReceipt) {
    option (command) = {name: "git.unstage" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc Discard(DiscardRequest) returns (CommandReceipt) {
    option (command) = {name: "git.discard" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc Commit(CommitRequest) returns (CommandReceipt) {
    option (command) = {name: "git.commit" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc Pull(PullRequest) returns (CommandReceipt) {
    option (command) = {name: "git.pull" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc Push(PushRequest) returns (CommandReceipt) {
    option (command) = {name: "git.push" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
  rpc ChangeWorktree(ChangeWorktreeRequest) returns (CommandReceipt) {
    option (command) = {name: "git.worktree" risk: RISK_DELIVERY scopes: SCOPE_FILES_GIT};
  }
}

message GetStatusRequest {
  ProjectRef project = 1;
}

message ListRefsRequest {
  ProjectRef project = 1;
}

message GitStatus {
  ProjectRef project = 1;
  string head_oid = 2;
  string branch = 3;
  repeated GitFile files = 4;
  optional string operation = 5;
  GitPrecondition expected = 6;
}

message GitFile {
  string path = 1;
  string index_status = 2;
  string worktree_status = 3;
  optional string previous_path = 4;
}

message ReadDiffRequest {
  ProjectRef project = 1;
  string path = 2;
  bool staged = 3;
  optional string commit = 4;
}

message DiffLine {
  optional uint32 old_line = 1;
  optional uint32 new_line = 2;
  string kind = 3;
  string text = 4;
}

message DiffChunk {
  repeated DiffLine lines = 1;
  bool binary = 2;
  bool complete = 3;
  bool truncated = 4;
}

message ReadHistoryRequest {
  ProjectRef project = 1;
  optional string before_oid = 2;
  uint32 limit = 3;
}

message GitCommit {
  string oid = 1;
  string title = 2;
  string author = 3;
  int64 time_unix = 4;
  repeated string parents = 5;
}

message GitHistory {
  repeated GitCommit commits = 1;
  optional string next_before_oid = 2;
}

message GitRef {
  string name = 1;
  string oid = 2;
  string kind = 3;
}

message GitRefs {
  repeated GitRef refs = 1;
}

message GitPrecondition {
  string head_oid = 1;
  bytes index_hash = 2;
  bytes worktree_hash = 3;
  optional string preflight_id = 4;
}

message StageRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  repeated string paths = 3;
  GitPrecondition expected = 4;
}

message UnstageRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  repeated string paths = 3;
  GitPrecondition expected = 4;
}

message DiscardRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  repeated string paths = 3;
  GitPrecondition expected = 4;
}

message CommitRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  string message = 3;
  GitPrecondition expected = 4;
  bool sign = 5;
}

message PullRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  string remote = 3;
  GitPrecondition expected = 4;
  optional string upstream_branch = 5;
}

message PushRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  string remote = 3;
  GitPrecondition expected = 4;
  optional string upstream_branch = 5;
}

message ChangeWorktreeRequest {
  CommandMeta command = 1;
  ProjectRef project = 2;
  GitWorktreeIntent intent = 3;
  GitPrecondition expected = 4;
}

enum WorktreeAction {
  WORKTREE_ACTION_UNSPECIFIED = 0;
  WORKTREE_ACTION_CREATE = 1;
  WORKTREE_ACTION_REMOVE = 2;
  WORKTREE_ACTION_MERGE = 3;
  WORKTREE_ACTION_STOP = 4;
  WORKTREE_ACTION_DELETE_BRANCH = 5;
}

enum GitPathOperation {
  GIT_PATH_OPERATION_UNSPECIFIED = 0;
  GIT_PATH_OPERATION_STAGE = 1;
  GIT_PATH_OPERATION_UNSTAGE = 2;
  GIT_PATH_OPERATION_DISCARD = 3;
}

enum GitNetworkAction {
  GIT_NETWORK_ACTION_UNSPECIFIED = 0;
  GIT_NETWORK_ACTION_PULL = 1;
  GIT_NETWORK_ACTION_PUSH = 2;
}

message GitPathIntent {
  GitPathOperation operation = 1;
  repeated string paths = 2;
}

message GitCommitIntent {
  string message = 1;
  bool sign = 2;
}

message GitNetworkIntent {
  GitNetworkAction action = 1;
  string remote = 2;
  optional string upstream_branch = 3;
}

message GitWorktreeIntent {
  WorktreeAction action = 1;
  string branch = 2;
  optional string path = 3;
  optional string start_point = 4;
  optional string target_branch = 5;
  bool delete_branch = 6;
  bool discard_changes = 7;
  bool delete_unmerged_branch = 8;
  bool acknowledge_offline_dirty = 9;
}

message PreflightRequest {
  ProjectRef project = 1;
  oneof intent {
    GitPathIntent paths = 2;
    GitCommitIntent commit = 3;
