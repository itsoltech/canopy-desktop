message GitHistory { repeated GitCommit commits = 1; optional string next_before_oid = 2; }
message GitRef { string name = 1; string oid = 2; string kind = 3; }
message GitRefs { repeated GitRef refs = 1; }
message GitPrecondition { string head_oid = 1; bytes index_hash = 2; bytes worktree_hash = 3; optional string preflight_id = 4; }
message GitPathsRequest { CommandMeta command = 1; WorkspaceRef workspace = 2; repeated string paths = 3; GitPrecondition expected = 4; }
message CommitRequest { CommandMeta command = 1; WorkspaceRef workspace = 2; string message = 3; GitPrecondition expected = 4; bool sign = 5; }
message GitNetworkRequest { CommandMeta command = 1; WorkspaceRef workspace = 2; string remote = 3; GitPrecondition expected = 4; optional string upstream_branch = 5; }
enum WorktreeAction { WORKTREE_ACTION_UNSPECIFIED = 0; CREATE_WORKTREE = 1; REMOVE_WORKTREE = 2; MERGE_WORKTREE = 3; STOP_WORKTREE = 4; }
message WorktreeRequest {
  CommandMeta command = 1; WorkspaceRef workspace = 2; WorktreeAction action = 3;
  string branch = 4; optional string path = 5; GitPrecondition expected = 6;
  optional string start_point = 7; optional string target_branch = 8;
  bool delete_branch = 9; bool discard_changes = 10;
  bool delete_unmerged_branch = 11; bool acknowledge_offline_dirty = 12;
}
enum GitPathOperation { GIT_PATH_OPERATION_UNSPECIFIED = 0; STAGE_PATHS = 1; UNSTAGE_PATHS = 2; DISCARD_PATHS = 3; }
enum GitNetworkAction { GIT_NETWORK_ACTION_UNSPECIFIED = 0; PULL_REMOTE = 1; PUSH_REMOTE = 2; }
