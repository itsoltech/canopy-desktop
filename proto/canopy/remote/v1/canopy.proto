  string id = 1; string agent_id = 2; string name = 3; repeated EnvironmentField environment = 4; bool credential_configured = 5;
  optional string model = 6; StringValues arguments = 7; ProfileAgentSettings settings = 8;
}
// These are metadata, not secret-bearing overrides. Original JSON/env/system
// prompt values are never returned. An omitted update preserves existing state.
message ProfileAgentSettings {
  optional string permission_mode = 1; optional string effort_level = 2;
  optional string base_url = 3; optional string provider = 4;
  optional string approval_mode = 5; optional string sandbox = 6;
  optional bool full_auto = 7; optional bool bypass_approvals = 8;
  optional string config_profile = 9;
  bool system_prompt_configured = 10; bool settings_override_configured = 11;
}
