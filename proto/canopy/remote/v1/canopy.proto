message Integration {
  string id = 1; string kind = 2; string name = 3; string endpoint = 4; bool credential_configured = 5;
  optional string owner = 6; optional string email = 7; optional string cloud_id = 8;
}
message HostPreferences {
  bool reopen_last_workspace = 1; bool notch_enabled = 2; string new_tab_tool = 3; string new_worktree_tool = 4;
  optional string chat_profile = 5; optional string chat_model = 6; optional string chat_effort = 7; optional string chat_mode = 8;
}
message HostSettings { string host_id = 1; uint64 revision = 2; repeated AgentDefinition agents = 3; repeated Profile profiles = 4; repeated Integration integrations = 5; HostPreferences preferences = 6; }
message UpdatePreferencesRequest {
  CommandMeta command = 1; optional bool reopen_last_workspace = 2; optional bool notch_enabled = 3; optional string new_tab_tool = 4; optional string new_worktree_tool = 5;
  optional string chat_profile = 6; optional string chat_model = 7; optional string chat_effort = 8; optional string chat_mode = 9;
}
message SaveAgentDefinitionRequest { CommandMeta command = 1; AgentDefinition agent = 2; repeated EnvironmentUpdate environment = 3; }
message RemoveAgentDefinitionRequest { CommandMeta command = 1; string agent_id = 2; }
message SaveProfileRequest { CommandMeta command = 1; Profile profile = 2; repeated EnvironmentUpdate environment = 3; SecretUpdate credential = 4; ProfileSettingsUpdate settings = 5; }
message RemoveProfileRequest { CommandMeta command = 1; string profile_id = 2; }
message SaveIntegrationRequest { CommandMeta command = 1; Integration integration = 2; SecretUpdate credential = 3; }
message RemoveIntegrationRequest { CommandMeta command = 1; string integration_id = 2; }
message TaskRef { string host_id = 1; string integration_id = 2; string task_id = 3; string project_id = 4; optional WorkspaceRef workspace = 5; }
message QueryTasksRequest { string host_id = 1; string integration_id = 2; string query = 3; optional string page_token = 4; string project_id = 5; optional WorkspaceRef workspace = 6; optional string filter_id = 7; optional string filter_expression = 8; string state = 9; }
message GetTaskRequest { TaskRef task = 1; }
message Task { TaskRef task = 1; string title = 2; string description = 3; string state = 4; string url = 5; repeated ArtifactRef attachments = 6; repeated string labels = 7; repeated string assignees = 8; optional TaskChoice milestone = 9; repeated TaskStatusField statuses = 10; repeated TaskField fields = 11; repeated TaskAttachment task_attachments = 12; repeated Capability capabilities = 13; repeated TaskLink links = 14; }
message TaskLink { string id = 1; string kind = 2; string other_task = 3; string label = 4; bool outward = 5; }
message TaskPage { repeated Task tasks = 1; optional string next_page_token = 2; optional uint64 total_count = 3; repeated TaskFilter filters = 4; }
message UpdateTaskRequest { CommandMeta command = 1; TaskRef task = 2; optional string title = 3; optional string description = 4; optional string state_id = 5 [deprecated=true]; TaskStatusChoice status = 6; optional StringValues labels = 7; optional StringValues assignees = 8; optional TaskOptionalChoice milestone = 9; }
message TaskToWorktreeRequest { CommandMeta command = 1; TaskRef task = 2; WorkspaceRef workspace = 3; string branch = 4; }

// Provider-defined field values use the standard Protobuf Value/Struct. Methods,
// mutation kinds, workflow choices and schema purposes remain explicit and typed.
message TaskProject { string host_id = 1; string integration_id = 2; string project_id = 3; optional WorkspaceRef workspace = 4; }
message TaskChoice { string id = 1; string label = 2; optional string description = 3; google.protobuf.Value value = 4; }
message TaskChoicePage { repeated TaskChoice choices = 1; optional string next_page_token = 2; }
message StringValues { repeated string values = 1; }
message TaskOptionalChoice { optional string id = 1; }
message TaskProjectsRequest { string host_id = 1; string integration_id = 2; optional WorkspaceRef workspace = 3; optional string page_token = 4; }
message TaskIntegrationsRequest { string host_id = 1; optional WorkspaceRef workspace = 2; }
message TaskIntegration { string id = 1; string name = 2; string provider = 3; bool configured = 4; }
message TaskIntegrations { repeated TaskIntegration integrations = 1; }
message TaskOptionsRequest { TaskProject project = 1; string kind = 2; optional string page_token = 3; optional string board_id = 4; }
message TaskFilter { string id = 1; string name = 2; string expression = 3; string provider = 4; bool builtin = 5; }
message SaveTaskFilterRequest { CommandMeta command = 1; TaskFilter filter = 2; }
message RemoveTaskFilterRequest { CommandMeta command = 1; string filter_id = 2; }
enum TaskSchemaPurpose { TASK_SCHEMA_PURPOSE_UNSPECIFIED = 0; TASK_CREATE = 1; TASK_EDIT = 2; TASK_TRANSITIONS = 3; TASK_TYPES = 4; TASK_LINK_TYPES = 5; TASK_BOARDS = 6; TASK_SPRINTS = 7; TASK_HISTORY = 8; }
message TaskSchemaRequest { TaskProject project = 1; optional TaskRef task = 2; TaskSchemaPurpose purpose = 3; optional string issue_type_id = 4; optional string board_id = 5; optional string page_token = 6; }
message TaskField { string id = 1; string name = 2; string kind = 3; bool required = 4; bool read_only = 5; bool multiple = 6; repeated TaskChoice choices = 7; google.protobuf.Value current_value = 8; google.protobuf.Value default_value = 9; google.protobuf.Struct provider_schema = 10; optional string read_only_reason = 11; }
message TaskTransition { string id = 1; string name = 2; string destination = 3; repeated TaskField required_fields = 4; }
message TaskStatusField { string id = 1; string name = 2; string label = 3; optional string selected_id = 4; repeated TaskChoice choices = 5; optional string read_only_reason = 6; optional string hint = 7; bool requires_form = 8; }
message TaskSchema { repeated TaskField fields = 1; repeated TaskTransition transitions = 2; repeated TaskChoice choices = 3; repeated string activity = 4; optional string next_page_token = 5; }
message TaskStatusChoice { string field_id = 1; string choice_id = 2; google.protobuf.Struct form_fields = 3; optional string comment = 4; }
message TaskComment { string id = 1; string author = 2; string created_at = 3; string body = 4; string url = 5; bool can_edit = 6; bool can_delete = 7; google.protobuf.Value rich_body = 8; }
message TaskCommentsRequest { TaskRef task = 1; optional string page_token = 2; }
message TaskCommentPage { repeated TaskComment comments = 1; optional string next_page_token = 2; uint64 total_count = 3; }
message TaskAttachment { string id = 1; string name = 2; string media_type = 3; uint64 size = 4; bool can_delete = 5; }
message TaskAttachmentRequest { TaskRef task = 1; string attachment_id = 2; }
message TaskIssueDraft { string title = 1; string description = 2; repeated string labels = 3; repeated string assignees = 4; optional string milestone_id = 5; google.protobuf.Struct fields = 6; }
message TaskCommentWrite { optional string comment_id = 1; string body = 2; google.protobuf.Value rich_body = 3; bool delete = 4; }
message TaskFieldWrite { string field_id = 1; google.protobuf.Value value = 2; }
message TaskTagWrite { string id = 1; bool add = 2; }
message TaskAssigneeWrite { string id = 1; bool add = 2; }
message TaskAttachmentWrite { oneof action { ArtifactRef attach = 1; string delete_id = 2; } string name = 3; }
message TaskLinkWrite { string kind = 1; string other_task = 2; bool outward = 3; optional string delete_link_id = 4; }
message TaskWorklogWrite { uint64 seconds = 1; string started = 2; string comment = 3; }
message TaskDelete { string confirmation = 1; bool subtasks = 2; }
message TaskMutationRequest {
  CommandMeta command = 1; TaskProject project = 2; optional TaskRef task = 3;
  oneof action { TaskIssueDraft create = 4; TaskFieldWrite field = 5; google.protobuf.Struct fields = 6;
    TaskStatusChoice status = 7; TaskCommentWrite comment = 8; TaskTagWrite tag = 9;
    TaskAssigneeWrite assignee = 10; TaskOptionalChoice milestone = 11; TaskAttachmentWrite attachment = 12;
    TaskLinkWrite link = 13; TaskWorklogWrite worklog = 14; bool watching = 15; bool voted = 16;
    TaskDelete delete = 17; TaskOptionalChoice sprint = 18; }
}
