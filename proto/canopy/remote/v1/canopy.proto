message CreateFileRequest { CommandMeta command = 1; FileRef file = 2; bool directory = 3; optional ArtifactRef content = 4; }
message DirtyBufferPresence { string device_id = 1; FileRef file = 2; bytes base_hash = 3; int64 last_seen_unix = 4; bool online = 5; }
message DirtyPresenceRequest { CommandMeta command = 1; FileRef file = 2; bytes base_hash = 3; bool dirty = 4; }
