  WorkspaceRef workspace = 1; string plan_id = 2; GitPrecondition expected = 3;
  repeated string impacts = 4; bool can_execute = 5; string reason = 6; int64 expires_unix = 7;
}

message TerminalSummary { TerminalRef terminal = 1; WorkspaceRef workspace = 2; string title = 3; bool running = 4; optional string input_device_id = 5; }
message OpenTerminalRequest { CommandMeta command = 1; WorkspaceRef workspace = 2; string tool_id = 3; optional string profile_id = 4; }
message TerminalCommandRequest { CommandMeta command = 1; TerminalRef terminal = 2; string run_id = 3; }
message AcquireInputRequest { CommandMeta command = 1; TerminalRef terminal = 2; bool take_over = 3; }
message ReleaseInputRequest { CommandMeta command = 1; TerminalRef terminal = 2; string run_id = 3; uint64 fencing_token = 4; }
message InputLease { TerminalRef terminal = 1; string run_id = 2; uint64 fencing_token = 3; uint32 expires_in_ms = 4; bool held = 5; }
message TerminalSubscribe { TerminalRef terminal = 1; optional Cursor since = 2; }
message TerminalInput { TerminalRef terminal = 1; string run_id = 2; uint64 fencing_token = 3; uint64 input_id = 4; bytes data = 5; }
message TerminalResize { TerminalRef terminal = 1; string run_id = 2; uint64 fencing_token = 3; uint32 columns = 4; uint32 rows = 5; }
message TerminalRenew { TerminalRef terminal = 1; string run_id = 2; uint64 fencing_token = 3; }
message TerminalClientEvent { oneof event { TerminalSubscribe subscribe = 1; TerminalInput input = 2; TerminalResize resize = 3; TerminalRenew renew = 4; } }
// Stable wire masks, deliberately independent of the Alacritty ABI. Combine
// powers of two in TerminalFrame.input_modes / TerminalCell.flags respectively.
enum TerminalInputMode {
  TERMINAL_INPUT_MODE_UNSPECIFIED = 0; APPLICATION_CURSOR = 1; APPLICATION_KEYPAD = 2;
  BRACKETED_PASTE = 4; ALTERNATE_SCREEN = 8; CURSOR_VISIBLE = 16;
  NEW_LINE_MODE = 32; FOCUS_REPORTING = 64; MOUSE_CLICK = 128; MOUSE_DRAG = 256;
  MOUSE_MOTION = 512; SGR_MOUSE = 1024; UTF8_MOUSE = 2048; ALTERNATE_SCROLL = 4096;
}
enum TerminalCellFlag {
  TERMINAL_CELL_FLAG_UNSPECIFIED = 0; CELL_BOLD = 1; CELL_ITALIC = 2; CELL_UNDERLINE = 4;
  CELL_INVERSE = 8; CELL_DIM = 16; CELL_STRIKEOUT = 32; CELL_WIDE = 64;
  CELL_WIDE_SPACER = 128; CELL_LEADING_WIDE_SPACER = 256; CELL_HIDDEN = 512;
  CELL_WRAPLINE = 1024; CELL_DOUBLE_UNDERLINE = 2048; CELL_UNDERCURL = 4096;
  CELL_DOTTED_UNDERLINE = 8192; CELL_DASHED_UNDERLINE = 16384;
}
// Colors are packed R<<24 | G<<16 | B<<8 | A. Wide spacers occupy no text span.
message TerminalCell { uint32 column = 1; uint32 row = 2; string text = 3; uint32 foreground_rgba = 4; uint32 background_rgba = 5; uint32 flags = 6; uint32 column_span = 7; }
// complete=true atomically replaces the viewport; false patches only listed
// cells and updates metadata. A frame is never split into standalone partial
// replacements. Oversized live frames use frame_fragment below instead.
message TerminalFrame { uint32 columns = 1; uint32 rows = 2; repeated TerminalCell cells = 3; uint32 cursor_column = 4; uint32 cursor_row = 5; uint64 input_modes = 6; bool lost_scrollback = 7; bool complete = 8; }
// Encoded TerminalFrame, same bounded assembly rules as ItemFragment: <=64KiB
// data, <=32MiB total, SHA256 of the complete encoding, contiguous offsets,
// one non-interleaved assembly per subscription. Each fragment advances the live
// cursor; clients commit a resumable cursor only after verified atomic install.
message TerminalFrameFragment { string frame_id = 1; uint64 offset = 2; uint64 total_bytes = 3; bytes sha256 = 4; bytes data = 5; }
message TerminalInputAck { uint64 input_id = 1; bool queued = 2; optional DomainError error = 3; }
message TerminalServerEvent { TerminalRef terminal = 1; string run_id = 2; Cursor cursor = 3; oneof event { TerminalFrame frame = 4; InputLease lease = 5; TerminalInputAck input_ack = 6; ResyncRequired resync = 7; DomainError error = 8; TerminalFrameFragment frame_fragment = 9; } }
// History is a read-only viewport. The host must not change its own display
// offset/selection. A token binds the run and a captured projection revision;
// an invalidated token requires a fresh read, never a mixed scrollback page.
message TerminalHistoryRequest { TerminalRef terminal = 1; string run_id = 2; uint32 offset_from_bottom = 3; uint32 rows = 4; optional string page_token = 5; }
message TerminalHistoryStart { Cursor boundary = 1; uint32 offset_from_bottom = 2; uint32 retained_rows = 3; bool lost_scrollback = 4; optional string previous_page_token = 5; }
message TerminalHistoryEvent { TerminalRef terminal = 1; string run_id = 2; oneof part { TerminalHistoryStart start = 3; TerminalFrame frame = 4; Cursor end = 5; TerminalFrameFragment frame_fragment = 6; } }

message ArtifactRef { string host_id = 1; string artifact_id = 2; string media_type = 3; uint64 size = 4; bytes sha256 = 5; }
message BeginUploadRequest { CommandMeta command = 1; ResourceRef target = 2; string purpose = 3; uint64 size = 4; bytes sha256 = 5; string media_type = 6; }
message ByteRange { uint64 offset = 1; uint64 length = 2; }
message UploadStatus { string host_id = 1; string upload_id = 2; repeated ByteRange received = 3; optional ArtifactRef artifact = 4; }
message PutChunkRequest { string host_id = 1; string upload_id = 2; uint64 offset = 3; bytes data = 4; }
message GetUploadRequest { string host_id = 1; string upload_id = 2; }
message FinishUploadRequest { CommandMeta command = 1; string upload_id = 2; }
message CancelUploadRequest { CommandMeta command = 1; string upload_id = 2; }
message DownloadRequest { ArtifactRef artifact = 1; uint64 offset = 2; }
message ArtifactChunk { ArtifactRef artifact = 1; uint64 offset = 2; bytes data = 3; bool complete = 4; }

message SecretUpdate { oneof action { Empty unchanged = 1; bytes set = 2; Empty remove = 3; } }
message EnvironmentField { string name = 1; bool configured = 2; }
message EnvironmentUpdate { string name = 1; SecretUpdate value = 2; }
enum BackendKind { BACKEND_KIND_UNSPECIFIED = 0; CLAUDE_STREAM_JSON = 1; CODEX_APP_SERVER = 2; ACP = 3; }
message AgentDefinition { string id = 1; string name = 2; BackendKind backend_kind = 3; string command = 4; repeated string arguments = 5; repeated EnvironmentField environment = 6; optional bool enabled = 7; optional string default_profile_id = 8; }
