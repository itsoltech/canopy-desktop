  WorktreeAction action = 1; string branch = 2; optional string path = 3;
  optional string start_point = 4; optional string target_branch = 5;
  bool delete_branch = 6; bool discard_changes = 7;
  bool delete_unmerged_branch = 8; bool acknowledge_offline_dirty = 9;
}
